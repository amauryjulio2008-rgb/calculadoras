<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Tarifas de Transporte</title>
  <style>

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #f4f7fb;          
      font-family: "Segoe UI", Arial, sans-serif;
      text-align: center;                  
      color: #2c3e50;
    }

    .tarjeta {
      width: 92%;
      max-width: 460px;
      background: #ffffff;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
      border-top: 10px solid var(--color);
    }

    .tarjeta h1 {
      margin: 0;
      padding: 22px 16px;
      font-size: 1.5rem;
      background-color: var(--color-suave);
      color: var(--color-oscuro);
    }

    .contenido { padding: 22px; }

    .saludo { font-size: 1.1rem; margin-bottom: 18px; }

    table { width: 100%; border-collapse: collapse; margin-bottom: 18px; }

    td {
      padding: 11px 6px;
      border-bottom: 1px solid #e3e8ef;
      text-align: center;
    }

    .total {
      font-size: 1.6rem;
      font-weight: bold;
      padding: 16px;
      border-radius: 10px;
      background-color: var(--color);
      color: var(--color-texto);
    }

    .error {
      padding: 30px;
      color: #c0392b;
      font-size: 1.1rem;
    }

    .bus {
      --color: #27ae60; --color-suave: #e8f8ef;
      --color-oscuro: #1e8449; --color-texto: #ffffff;
    }
    .metro {
      --color: #2980b9; --color-suave: #e7f1fa;
      --color-oscuro: #1f618d; --color-texto: #ffffff;
    }
    .taxi {
      --color: #f1c40f; --color-suave: #fef9e2;
      --color-oscuro: #9a7d0a; --color-texto: #2c3e50;
    }
    .intermunicipal {
      --color: #e67e22; --color-suave: #fdf0e3;
      --color-oscuro: #a04000; --color-texto: #ffffff;
    }
    .invalido {
      --color: #c0392b; --color-suave: #fdecea;
      --color-oscuro: #922b21; --color-texto: #ffffff;
    }
  </style>
</head>
<body>

<script>
  var nombre = prompt("Ingrese su nombre:");
  var tipoTransporte = parseInt(prompt(
    "Seleccione el tipo de transporte:\n" +
    "1 = Bus Urbano\n2 = Metro\n3 = Taxi\n4 = Intermunicipal"
  ));
  var condicion = parseInt(prompt(
    "Seleccione su condición especial:\n" +
    "1 = Estudiante\n2 = Adulto mayor\n3 = Ninguna"
  ));

  if (nombre === null || nombre.trim() === "") {
    nombre = "Usuario";
  }

  
  var nombreTransporte = "";
  var tarifaBase = 0;
  var tema = "";          
  var datosValidos = true;

  switch (tipoTransporte) {
    case 1:
      nombreTransporte = "Bus Urbano";
      tarifaBase = 2500;
      tema = "bus";
      break;
    case 2:
      nombreTransporte = "Metro";
      tarifaBase = 2800;
      tema = "metro";
      break;
    case 3:
      nombreTransporte = "Taxi";
      tarifaBase = 5000;
      tema = "taxi";
      break;
    case 4:
      nombreTransporte = "Intermunicipal";
      tarifaBase = 10000;
      tema = "intermunicipal";
      break;
    default:
      datosValidos = false;
      tema = "invalido";
  }

  
  var nombreCondicion = "";
  var porcentajeDescuento = 0;

  if (condicion === 1) {
    nombreCondicion = "Estudiante";
    porcentajeDescuento = 0.20;
  } else if (condicion === 2) {
    nombreCondicion = "Adulto mayor";
    porcentajeDescuento = 0.30;
  } else if (condicion === 3) {
    nombreCondicion = "Ninguna";
    porcentajeDescuento = 0;
  } else {
    datosValidos = false;
    tema = "invalido";
  }

  
  var descuentoPesos = tarifaBase * porcentajeDescuento;
  var totalPagar = tarifaBase - descuentoPesos;

 
  function formatoPesos(valor) {
    return "$" + valor.toLocaleString("es-CO");
  }

  
  if (datosValidos) {
    document.write('<div class="tarjeta ' + tema + '">');
    document.write('<h1>Calculadora de Tarifas de Transporte</h1>');
    document.write('<div class="contenido">');
    document.write('<p class="saludo">Hola, <strong>' + nombre + '</strong></p>');
    document.write('<table>');
    document.write('<tr><td>Transporte</td><td><strong>' + nombreTransporte + '</strong></td></tr>');
    document.write('<tr><td>Condición especial</td><td><strong>' + nombreCondicion + '</strong></td></tr>');
    document.write('<tr><td>Tarifa base</td><td><strong>' + formatoPesos(tarifaBase) + '</strong></td></tr>');
    document.write('<tr><td>Descuento aplicado</td><td><strong>' + (porcentajeDescuento * 100) + '%</strong></td></tr>');
    document.write('<tr><td>Valor del descuento</td><td><strong>' + formatoPesos(descuentoPesos) + '</strong></td></tr>');
    document.write('</table>');
    document.write('<div class="total">Total a pagar: ' + formatoPesos(totalPagar) + '</div>');
    document.write('</div></div>');
  } else {
    document.write('<div class="tarjeta invalido">');
    document.write('<h1>Datos no válidos</h1>');
    var detalle = "";
    if (isNaN(tipoTransporte) || tipoTransporte < 1 || tipoTransporte > 4) {
      detalle += "Transporte no válido (debe ser 1, 2, 3 o 4).<br>";
    }
    if (isNaN(condicion) || condicion < 1 || condicion > 3) {
      detalle += "Condición especial no válida (debe ser 1, 2 o 3).<br>";
    }
    document.write('<div class="error">' + detalle + '<br>Recargue la página para intentarlo de nuevo.<br><small>Si abrió el archivo desde una vista previa, descárguelo y ábralo en el navegador.</small></div>');
    document.write('</div>');
  }
</script>

</body>
</html>
